services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/data/sentinel.db
      AUTH_INITIAL_ADMIN_EMAIL: ${AUTH_INITIAL_ADMIN_EMAIL:-}
      AUTH_INITIAL_ADMIN_PASSWORD: ${AUTH_INITIAL_ADMIN_PASSWORD:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:8080}
      TRUST_PROXY: "1"
      ALERT_ENCRYPTION_KEY: ${ALERT_ENCRYPTION_KEY:-}
      DEVICE_ENCRYPTION_KEY: ${DEVICE_ENCRYPTION_KEY:-}
    volumes:
      - sentinel_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["npm", "run", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/sentinel.db
      ALERT_ENCRYPTION_KEY: ${ALERT_ENCRYPTION_KEY:-}
      DEVICE_ENCRYPTION_KEY: ${DEVICE_ENCRYPTION_KEY:-}
    volumes:
      - sentinel_data:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 3m

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sentinel_data:
